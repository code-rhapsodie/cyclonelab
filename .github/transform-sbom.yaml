variables:
  version:
    required: true
  tag:
    required: true

foreach:
  dir: ../dist
  pattern: "cyclonelab-*"

steps:
  - id: upgrade
    action: upgrade
    version_target: "1.7"

  - id: fix component purl
    action: add
    description: >
      cargo-cyclonedx derives metadata.component.purl from Cargo.toml
      (pkg:cargo/...@...?download_url=file://...), which points at the
      local checkout rather than cyclonelab's real distribution channel
      (GitHub releases). Replace it with the same pkg:generic purl used
      in metadata.tools.
    target: $.metadata.component.purl
    value: "pkg:generic/code-rhapsodie/cyclonelab@{$version}"

  - id: remove build target subcomponents
    action: remove
    description: cargo-cyclonedx still emits one subcomponent per build target (lib/bin); no longer meaningful now that they're merged.
    target: $.metadata.component.components

  - id: add declared licence
    action: add
    description: Replace cargo-cyclonedx's bare Cargo.toml-derived expression with one explicitly marked as declared.
    target: $.metadata.component.licenses
    value:
      - expression: "EUPL-1.2 OR AGPL-3.0"
        acknowledgement: declared

  - id: add EUPL license evidence
    action: add
    description: >
      Attach the full text of the EUPL-1.2 license as evidence, at the schema's dedicated location for
      evidence collected through analysis (metadata.component.evidence.licenses, see componentEvidence in
      schema/bom-1.6.schema.json) -- separate from the plain SPDX expression declared just above. Read from the
      repo's LICENSE-EUPL-1.2 rather than duplicated in this file, so it always matches the actual license text.
    target: $.metadata.component.evidence.licenses[]
    valueFrom:
      file: ../LICENSE-EUPL-1.2
      format: text
    value:
      - license:
          id: "EUPL-1.2"
          acknowledgement: declared
          url: "https://spdx.org/licenses/EUPL-1.2.html"
          text:
            contentType: text/plain
            content: "{@value}"

  - id: add AGPL license evidence
    action: add
    description: >
      Same as above, for AGPL-3.0, read from LICENSE-AGPL-3.0. Appended to the same evidence.licenses array via
      the trailing [] on target.
    target: $.metadata.component.evidence.licenses[]
    valueFrom:
      file: ../LICENSE-AGPL-3.0
      format: text
    value:
      - license:
          id: "AGPL-3.0"
          acknowledgement: declared
          url: "https://spdx.org/licenses/AGPL-3.0-only.html"
          text:
            contentType: text/plain
            content: "{@value}"

  - id: add author
    action: merge
    target: $.metadata.component.authors
    value: '[{"name": "Jean-Baptiste NAHAN", "email":"jean-baptiste@code-rhapsodie.fr"}]'

  - id: add manufacturer
    action: merge
    target: $.metadata.component.manufacturer
    value: '{"name": "Code Rhapsodie", "url":["https://www.code-rhapsodie.fr"]}'

  - id: external reference
    action: merge
    target: $.metadata.component.externalReferences[]
    value: '[{
    "type": "vcs",
        "url": "https://github.com/code-rhapsodie/cyclonelab.git"
      },{
    "type": "issue-tracker",
        "url": "https://github.com/code-rhapsodie/cyclonelab/issues"
      },{
    "type": "website",
        "url": "https://www.code-rhapsodie.fr"
      },{
    "type": "license",
        "url": "https://spdx.org/licenses/EUPL-1.2.html"
      },{
    "type": "license",
        "url": "https://spdx.org/licenses/AGPL-3.0-only.html"
      }]'

  - id: add distribution reference
    action: merge
    description: One SBOM is generated per released binary (see `foreach`); point it at its own asset.
    target: $.metadata.component.externalReferences[]
    value: '[{"type": "distribution", "url": "https://github.com/code-rhapsodie/cyclonelab/releases/download/{$tag}/{$artifact_name}"}]'

  - id: add distribution hash
    action: add
    description: sha256 of the binary this SBOM describes.
    target: $.metadata.component.externalReferences[?type==distribution].hashes
    valueFrom:
      generator: hash
      algo: sha256
      path: "{$artifact_path}"
    value:
      - alg: SHA-256
        content: "{@value}"