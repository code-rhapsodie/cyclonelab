[package]
name = "cyclonelab"
version = "0.1.0"
edition = "2024"
description = "Generator and manipulation tool for CycloneDX-format SBOMs"
license = "EUPL-1.2 OR AGPL-3.0"

[[bin]]
name = "cyclonelab"
path = "src/main.rs"

[features]
# Experimental JSON output for `suggest` (see `CYCLONELAB_SUGGEST_JSON` in
# src/commands/suggest.rs) and `lint` (see `CYCLONELAB_LINT_JSON` in
# src/commands/lint.rs). Off by default: not part of the stable CLI yet.
json-output = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["tls"] }
anyhow = "1"
jsonschema = { version = "0.55.1", default-features = false }
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
